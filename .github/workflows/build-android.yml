name: Build AuraMotion Android APK & Release

on:
  push:
    branches: [ "main", "master", "develop" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        required: true
        default: 'release'
        type: choice
        options:
          - 'release'
          - 'debug'
          - 'all'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-tests:
    name: 🧪 Run C++ Engine Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure CMake for Native Tests
        run: |
          cmake -B build-test -S . -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON

      - name: Build C++ Test Suite
        run: |
          cmake --build build-test --config Release -j $(nproc)

      - name: Execute C++ Engine Tests
        run: |
          ctest --test-dir build-test --output-on-failure --verbose
          ./build-test/test_engine

  build-android:
    name: 📱 Build Android APK & AAB
    needs: native-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK & Build Tools
        run: |
          sdkmanager --install "ndk;26.2.11394342" "cmake;3.22.1" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.2.11394342" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/26.2.11394342" >> $GITHUB_ENV

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build Android Debug APK
        run: |
          gradle assembleDebug --stacktrace

      - name: Build Android Release APK & Bundle (AAB)
        run: |
          gradle assembleRelease bundleRelease --stacktrace || true

      - name: Package Release Artifacts
        run: |
          mkdir -p release-artifacts
          find app/build/outputs -type f \( -name "*.apk" -o -name "*.aab" \) -exec cp {} release-artifacts/ \; || true
          cd release-artifacts
          if [ "$(ls -A .)" ]; then
            sha256sum * > SHA256SUMS.txt
          fi
          ls -lh

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AuraMotion-APK-Builds
          path: release-artifacts/
          retention-days: 14

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/*.apk
            release-artifacts/*.aab
            release-artifacts/SHA256SUMS.txt
          generate_release_notes: true
          draft: false
          prerelease: false
