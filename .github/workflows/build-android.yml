name: Build AuraMotion Android APK & Release

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-cpp-engine:
    name: 🧪 C++ Engine Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Essentials & CMake
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake build-essential libgl1-mesa-dev libgles2-mesa-dev libglm-dev

      - name: Configure CMake for Native Tests
        run: |
          cmake -S . -B build-test -DCMAKE_BUILD_TYPE=Release

      - name: Compile Native Tests
        run: |
          cmake --build build-test --config Release -j$(nproc)

      - name: Run Engine Tests
        run: |
          ctest --test-dir build-test --output-on-failure

  build-android:
    name: 📱 Build Android APK & AAB
    runs-on: ubuntu-latest
    needs: test-cpp-engine

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK & Build Tools
        run: |
          sdkmanager --install "ndk;26.2.11394342" "cmake;3.22.1" "build-tools;34.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Android Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Build Android Release APK & Bundle (AAB)
        run: |
          ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Package Release Artifacts
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/debug/app-debug.apk release-output/AuraMotion-v1.0.0-Debug.apk || true
          cp app/build/outputs/apk/release/app-release-unsigned.apk release-output/AuraMotion-v1.0.0-Release-unsigned.apk || true
          cp app/build/outputs/bundle/release/app-release.aab release-output/AuraMotion-v1.0.0.aab || true
          cd release-output
          sha256sum * > SHA256SUMS.txt
          ls -la

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AuraMotion-Android-Binaries
          path: release-output/*
          retention-days: 14

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-output/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
